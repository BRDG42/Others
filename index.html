<script>
  // Password check — stored as SHA-256 hash (not plaintext)
  const HASH = "323cbf0a06fee2f43ef021811bd9079979490ec3a54cecf4819507ad63d0c825";

  async function sha256(str) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  async function checkPassword() {
    const val = document.getElementById('pwd-input').value;
    const h = await sha256(val);
    if (h === HASH) {
      document.getElementById('lock-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      sessionStorage.setItem('dct_auth', '1');
    } else {
      const el = document.getElementById('pwd-input');
      el.classList.remove('shake');
      void el.offsetWidth;
      el.classList.add('shake');
      document.getElementById('pwd-error').textContent = 'Incorrect passcode. Try again.';
      el.value = '';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    if (sessionStorage.getItem('dct_auth') === '1') {
      document.getElementById('lock-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    }
    document.getElementById('pwd-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkPassword();
    });
  });
</script>

const computeOverall = (phases) => {
  const totalTasks = phases.flatMap(p => p.tasks);
  if (!totalTasks.length) return 0;
  return Math.round(totalTasks.reduce((s, t) => s + (t.progress||0), 0) / totalTasks.length);
};

const computeBaselineOverall = (phases) => {
  const totalTasks = phases.flatMap(p => p.tasks);
  if (!totalTasks.length) return 0;
  return Math.round(totalTasks.reduce((s, t) => s + (t.baseline||0), 0) / totalTasks.length);
};

// ─── PARSE TRACKER TSV ───────────────────────────────────────────────────────
const parseTrackerTSV = (raw) => {
  const lines = raw.trim().split('\n').filter(l => l.trim());
  const rows = [];
  for (const line of lines) {
    const cols = line.split('\t').map(c => c.trim());
    if (cols.length < 3) continue;
    // Try to detect header row
    if (/sr#|action item|priority/i.test(cols[0] + cols[1])) continue;
    const [id, item, priority, org, assigned, due, status] = cols;
    if (!item || item.length < 3) continue;
    const numId = parseInt(id);
    rows.push({
      id: isNaN(numId) ? rows.length + 1 : numId,
      item: item || '',
      priority: priority || 'Medium',
      org: org || '—',
      assigned: assigned || '—',
      due: due || '—',
      status: status || 'Pending',
    });
  }
  return rows;
};

// ─── PIN GATE ─────────────────────────────────────────────────────────────────
function PINGate({ onUnlock }) {
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);
  const [shake, setShake] = useState(false);

  const attempt = (p) => {
    if (p === PM_PIN) { onUnlock(); }
    else {
      setError(true); setShake(true); setPin('');
      setTimeout(() => setShake(false), 500);
      setTimeout(() => setError(false), 2000);
    }
  };

  const press = (d) => {
    if (d === '⌫') { setPin(p => p.slice(0, -1)); return; }
    const next = pin + d;
    setPin(next);
    if (next.length === 4) attempt(next);
  };

  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'32px 24px'}}>
      <div style={{width:52,height:52,borderRadius:14,background:`linear-gradient(135deg, ${C.violet900}, ${C.violet})`,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:16,boxShadow:`0 8px 24px ${C.violet}40`}}>
        <Lock size={22} color={C.white}/>
      </div>

// ─── PM PANEL ─────────────────────────────────────────────────────────────────
function PMPanel({ phases, actions, changelog, onSavePhases, onSaveActions, onClose }) {
  const [activeTab, setActiveTab] = useState('phases');

  // ── Phase editor state
  const [editPhases, setEditPhases] = useState(() =>
    phases.map(p => ({ ...p, tasks: p.tasks.map(t => ({ ...t })) }))
  );

  // ── Tracker paste state
  const [trackerRaw, setTrackerRaw] = useState('');
  const [parsedActions, setParsedActions] = useState(null);
  const [parseError, setParseError] = useState('');
  const [saveMsg, setSaveMsg] = useState('');

  const updateTaskProgress = (phaseIdx, taskIdx, val) => {
    setEditPhases(prev => {
      const next = prev.map(p => ({ ...p, tasks: p.tasks.map(t => ({ ...t })) }));
      next[phaseIdx].tasks[taskIdx].progress = val;
      // Auto-compute phase progress
      const tasks = next[phaseIdx].tasks;
      next[phaseIdx].progress = Math.round(tasks.reduce((s, t) => s + t.progress, 0) / tasks.length);
      next[phaseIdx].status = derivePhaseStatus(next[phaseIdx].progress);
      return next;
    });
  };

  const handleParseTracker = () => {
    setParseError('');
    if (!trackerRaw.trim()) { setParseError('Please paste your tracker data first.'); return; }
    const rows = parseTrackerTSV(trackerRaw);
    if (!rows.length) { setParseError('Could not parse any rows. Make sure you copied from Excel (tab-separated).'); return; }
    setParsedActions(rows);
  };

  const flash = (msg) => { setSaveMsg(msg); setTimeout(() => setSaveMsg(''), 2500); };

  const handleSavePhases = () => { onSavePhases(editPhases); flash('✓ Phase progress saved and dashboard updated.'); };
  const handleSaveActions = () => {
    if (!parsedActions) { setParseError('Parse the tracker first.'); return; }
    onSaveActions(parsedActions);
    setParsedActions(null); setTrackerRaw('');
    flash(`✓ Tracker updated — ${parsedActions.length} actions loaded.`);
  };

  const pTabs = [
    { id:'phases', label:'Edit Phases', icon:<Sliders size={13}/> },
    { id:'tracker', label:'Paste Tracker', icon:<Upload size={13}/> },
    { id:'changelog', label:`Changelog (${changelog.length})`, icon:<History size={13}/> },
  ];

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      {/* Panel header */}
      <div style={{background:`linear-gradient(135deg, ${C.dark}, ${C.violet900})`,padding:'16px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:32,height:32,borderRadius:8,background:'rgba(255,255,255,0.12)',display:'flex',alignItems:'center',justifyContent:'center'}}><Settings size={15} color={C.white}/></div>
          <div>
            <p style={{margin:0,color:C.white,fontSize:13,fontWeight:700}}>PM Control Panel</p>
            <p style={{margin:0,color:C.violet200,fontSize:10}}>Update project data · Changes persist across sessions</p>
          </div>
        </div>
        <button onClick={onClose} style={{background:'rgba(255,255,255,0.1)',border:'none',borderRadius:7,padding:'7px',cursor:'pointer',display:'flex'}}><X size={15} color={C.white}/></button>
      </div>

      {/* Sub-tabs */}
      <div style={{display:'flex',borderBottom:`2px solid ${C.violet100}`,background:C.white,flexShrink:0}}>
        {pTabs.map(t=>(
          <button key={t.id} onClick={()=>setActiveTab(t.id)}
            style={{flex:1,padding:'11px 8px',border:'none',background:'none',cursor:'pointer',fontFamily:'inherit',fontWeight:700,fontSize:11,display:'flex',alignItems:'center',justifyContent:'center',gap:5,color:activeTab===t.id?C.violet:C.gray500,borderBottom:activeTab===t.id?`2px solid ${C.violet}`:'2px solid transparent',marginBottom:-2,transition:'all 0.15s'}}>
            {t.icon}{t.label}
          </button>
        ))}
      </div>

      {/* Content area */}
      <div style={{flex:1,overflowY:'auto',padding:'20px'}}>

        {/* ── PHASES TAB ── */}
        {activeTab==='phases'&&(
          <div>
            <p style={{fontSize:12,color:C.gray500,marginBottom:16}}>Drag sliders or type values to update task completion. Phase % auto-calculates from its tasks.</p>

                <div style={{padding:'10px 14px'}}>
                  {phase.tasks.map((task, ti) => (
                    <div key={ti} style={{display:'grid',gridTemplateColumns:'1fr 140px 44px',gap:10,alignItems:'center',padding:'6px 0',borderBottom:ti<phase.tasks.length-1?`1px solid ${C.gray100}`:'none'}}>

                      <div style={{display:'flex',alignItems:'center'}}>
                        <input type="number" min={0} max={100} value={task.progress}

          </div>
        )}

        {/* ── TRACKER TAB ── */}
        {activeTab==='tracker'&&(
          <div>
            <div style={{background:C.violet50,borderRadius:10,padding:'12px 14px',marginBottom:16,border:`1px solid ${C.violet100}`}}>

            {parseError&&<p style={{fontSize:11,color:C.flamingo,margin:'6px 0 0',display:'flex',alignItems:'center',gap:5}}><AlertCircle size={12}/>{parseError}</p>}

            <div style={{display:'flex',gap:8,marginTop:10}}>

              {parsedActions&&(
                <button onClick={handleSaveActions}

  const overdue = actions.filter(a => a.due && a.due !== '—' && new Date(a.due) < new Date('2026-03-04') && a.status !== 'Done');
  const overall = computeOverall(phases);
  return `You are a CTO-level advisor for the Smart Check-In (Face Recognition) project at DCT Abu Dhabi.

LIVE PROJECT DATA:
Overall progress: ${overall}%. Pilot Go-Live: April 30, 2026.

PHASE STATUS:
${phases.map(p=>`- ${p.name}: ${p.progress}% (${p.status})`).join('\n')}

ACTION TRACKER (${actions.length} items):
- Done: ${actions.filter(a=>a.status==='Done').length}
- 75%: ${actions.filter(a=>a.status==='75%').length} | 50%: ${actions.filter(a=>a.status==='50%').length} | 25%: ${actions.filter(a=>a.status==='25%').length}
- Not Started: ${actions.filter(a=>a.status==='Not Started').length} | Pending: ${actions.filter(a=>a.status==='Pending').length}

CRITICAL OPEN ITEMS:

OVERDUE ITEMS:
${overdue.length ? overdue.map(a=>`- #${a.id} ${a.item} — due ${a.due}, status ${a.status}, owner ${a.assigned}`).join('\n') : 'None'}

Answer concisely and directly, referencing specific action IDs. Max 220 words unless asked for detail.`;

    setInput(''); setShowSuggestions(false);

                strokeDasharray={`${s.dash} ${circumference-s.dash}`}
                strokeDashoffset={-s.offset}

            <text x={65} y={60} textAnchor="middle" fontSize={22} fontWeight={800} fill={C.dark}>{actions.length}</text>

        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
          {[{label:'Total Actions',val:actions.length,color:C.violet,icon:'📋'},{label:'Completed',val:done,color:C.palm,icon:'✅'},{label:'Open Items',val:open,color:C.amber,icon:'🔄'},{label:'Critical Open',val:critical,color:C.flamingo,icon:'🚨'}].map((k,i)=>(

        </div>
      </div>
      <div style={{background:C.white,borderRadius:10,border:`1px solid ${C.violet100}`,padding:'12px 16px',marginBottom:14,display:'flex',flexWrap:'wrap',gap:10,alignItems:'center'}}>

          {(search||filterPriority!=='All'||filterStatus!=='All'||filterOrg!=='All')&&<button onClick={()=>{setSearch('');setFilterPriority('All');setFilterStatus('All');setFilterOrg('All');}} style={{background:C.flamingo50,border:`1px solid ${C.flamingo100}`,borderRadius:6,padding:'5px 10px',color:C.flamingo,fontSize:11,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>Clear</button>}
        </div>
        <span style={{fontSize:11,color:C.gray500,marginLeft:'auto'}}>{filtered.length} of {actions.length}</span>

              <span style={{fontSize:11,color:C.gray700}}>{a.assigned}</span>
              <span style={{fontSize:10,color:isOverdue?C.flamingo:C.gray500,fontWeight:isOverdue?700:400}}>{a.due}{isOverdue&&' ⚠'}</span>

function Dashboard() {
  const [phases, setPhases] = useState(DEFAULT_PHASES);
  const [actions, setActions] = useState(DEFAULT_ACTIONS);
  const [changelog, setChangelog] = useState([]);
  const [lastUpdated, setLastUpdated] = useState('Mar 9, 2026');
  const [loading, setLoading] = useState(true);

  const [tab, setTab] = useState('dashboard');
  const [expanded, setExpanded] = useState({});
  const [showPM, setShowPM] = useState(false);
  const [showEmail, setShowEmail] = useState(false);

  // Load persisted data on mount
  useEffect(() => {
    loadFromStorage().then(saved => {
      if (saved) {
        if (saved.phases) setPhases(saved.phases);
        if (saved.actions) setActions(saved.actions);
        if (saved.changelog) setChangelog(saved.changelog);
        if (saved.lastUpdated) setLastUpdated(saved.lastUpdated);
      }
      setLoading(false);
    });
  }, []);

  const persistAll = async (newPhases, newActions, newChangelog, ts) => {
    await saveToStorage({ phases: newPhases, actions: newActions, changelog: newChangelog, lastUpdated: ts });
  };

  const handleSavePhases = async (newPhases) => {
    const ts = new Date().toLocaleString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const changes = newPhases.map((p,i) => {
      const old = phases[i];
      if (old && old.progress !== p.progress) return `${p.name}: ${old.progress}% → ${p.progress}%`;
      return null;
    }).filter(Boolean);
    const entry = {
      type: 'phases',
      timestamp: ts,
      summary: `Phase progress updated by PM`,
      detail: changes.length ? changes.join(' · ') : 'No changes detected',
    };
    const newLog = [...changelog, entry];
    setPhases(newPhases);
    setChangelog(newLog);
    setLastUpdated(ts);
    await persistAll(newPhases, actions, newLog, ts);
  };

  const handleSaveActions = async (newActions) => {
    const ts = new Date().toLocaleString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const done = newActions.filter(a => a.status === 'Done').length;
    const open = newActions.filter(a => a.status !== 'Done').length;
    const entry = {
      type: 'actions',
      timestamp: ts,
      summary: `Action Tracker refreshed from Excel paste`,
      detail: `${newActions.length} total items · ${done} done · ${open} open`,
    };
    const newLog = [...changelog, entry];
    setActions(newActions);
    setChangelog(newLog);
    setLastUpdated(ts);
    await persistAll(phases, newActions, newLog, ts);
  };

  const toggle = (id) => setExpanded(prev => ({ ...prev, [id]: !prev[id] }));
  const overall = computeOverall(phases);
  const baseline = computeBaselineOverall(phases);

  const allTasks = phases.flatMap(p => p.tasks);
  const taskStatusData = useMemo(() => [
    {name:'Completed',value:allTasks.filter(t=>t.progress===100).length},
    {name:'In Progress',value:allTasks.filter(t=>t.progress>0&&t.progress<100).length},
    {name:'Not Started',value:allTasks.filter(t=>t.progress===0).length},
  ],[allTasks]);

  const gantt = useMemo(() => {
    const ps = new Date('2026-01-16');
    return phases.map(p => {
      const s=new Date(p.start),e=new Date(p.end);
      const sd=Math.max(0,Math.floor((s-ps)/864e5));
      const dur=Math.floor((e-s)/864e5);
      const done=Math.floor(dur*p.progress/100);
      return {name:p.name.length>26?p.name.slice(0,26)+'…':p.name,start:sd,done,rem:dur-done,pct:p.progress};
    });
  },[phases]);

  const p1Detail = useMemo(() => {
    const p1 = phases.find(p => p.id === 'phase1');
    if (!p1) return [];
    return [...p1.tasks].sort((a,b) => b.progress - a.progress);
  }, [phases]);

  const dashboardRef = useRef(null);

  const handleExportPDF = async () => {
    try {
      // Dynamically load libraries
      if (!window.html2canvas) {
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
          s.onload = res; s.onerror = rej; document.head.appendChild(s);
        });
      }
      if (!window.jspdf) {
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
          s.onload = res; s.onerror = rej; document.head.appendChild(s);
        });
      }
      const prevTab = tab;
      setTab('dashboard');
      await new Promise(r => setTimeout(r, 400));

      const el = dashboardRef.current;
      if (!el) return;

      const canvas = await window.html2canvas(el, {
        scale: 1.5,
        useCORS: true,
        backgroundColor: '#F5F4F8',
        logging: false,
        ignoreElements: el => el.classList?.contains('no-print')
      });

      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      const pdfW = pdf.internal.pageSize.getWidth();
      const pdfH = pdf.internal.pageSize.getHeight();
      const ratio = canvas.width / canvas.height;
      const totalPdfH = pdfW / ratio;
      let yOffset = 0;
      let pageH = pdfH;
      while (yOffset < totalPdfH) {
        if (yOffset > 0) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 0, -yOffset, pdfW, totalPdfH);
        yOffset += pageH;
      }
      const date = new Date().toISOString().slice(0,10);
      pdf.save(`SmartCheckIn_Dashboard_${date}.pdf`);
      setTab(prevTab);
    } catch(e) {
      alert('PDF export failed: ' + e.message);
    }
  };

  const card={background:C.white,borderRadius:12,border:`1px solid ${C.violet100}`,boxShadow:'0 1px 4px rgba(72,50,184,0.04)'};
  const h2s={fontSize:14,fontWeight:700,color:C.dark,letterSpacing:-0.2,margin:'0 0 16px'};

  const navTabs=[
    {id:'dashboard',label:'Dashboard',icon:<LayoutDashboard size={14}/>},
    {id:'actions',label:`Actions (${actions.filter(a=>a.status!=='Done').length} open)`,icon:<ListChecks size={14}/>},
    {id:'advisor',label:'Project Advisory Agent',icon:<Bot size={14}/>},
  ];

  if (loading) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:C.gray50}}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
        <Loader size={28} color={C.violet} className="spin"/>
        <p style={{fontSize:13,color:C.gray500,fontFamily:"'Segoe UI', sans-serif"}}>Loading project data…</p>
      </div>
    </div>
  );

  return (
    <div style={{background:C.gray50,minHeight:'100vh',fontFamily:"'Segoe UI', -apple-system, sans-serif"}}>
      {showEmail && <EmailModal onClose={()=>setShowEmail(false)}/>}
      {showPM && <PMModal phases={phases} actions={actions} changelog={changelog} onSavePhases={handleSavePhases} onSaveActions={handleSaveActions} onClose={()=>setShowPM(false)}/>}

      {/* HEADER */}
      <div style={{background:`linear-gradient(135deg,${C.dark} 0%,${C.violet900} 50%,${C.violet} 100%)`}}>
        <div style={{height:3,background:`linear-gradient(90deg,${C.flamingo},${C.violet},${C.palm})`}}/>
        <div style={{padding:'24px 32px 0',maxWidth:1280,margin:'0 auto'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
              <rect x="2" y="2" width="18" height="18" rx="2" fill="white" opacity="0.9"/>
              <rect x="24" y="2" width="18" height="18" rx="2" fill="white" opacity="0.7"/>
              <rect x="2" y="24" width="18" height="18" rx="2" fill="white" opacity="0.7"/>
              <rect x="24" y="24" width="18" height="18" rx="2" fill="white" opacity="0.5"/>
            </svg>
            <div style={{display:'flex',flexDirection:'column',borderLeft:'1px solid rgba(255,255,255,0.25)',paddingLeft:10}}>
              <span style={{color:C.white,fontSize:11,fontWeight:700,fontFamily:'serif',letterSpacing:0.5,lineHeight:1.2}}>دائرة الثقافة والسياحة</span>
              <span style={{color:'rgba(255,255,255,0.7)',fontSize:8.5,fontWeight:600,letterSpacing:1.2,textTransform:'uppercase',lineHeight:1.3}}>Department of Culture</span>
              <span style={{color:'rgba(255,255,255,0.7)',fontSize:8.5,fontWeight:600,letterSpacing:1.2,textTransform:'uppercase',lineHeight:1.1}}>and Tourism — Abu Dhabi</span>
            </div>
            <div style={{width:1,height:44,background:'rgba(255,255,255,0.15)',margin:'0 6px'}}/>
            <div>
              <h1 style={{color:C.white,fontSize:26,fontWeight:700,margin:0,letterSpacing:-0.5}}>Smart Check-In</h1>
              <p style={{color:C.violet200,fontSize:13,margin:'3px 0 0',fontWeight:500}}>Face Recognition System — Master Project Plan</p>
            </div>
            <div className="no-print" style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
              <button onClick={handleExportPDF}
                style={{background:'rgba(255,255,255,0.1)',border:'1px solid rgba(255,255,255,0.25)',borderRadius:8,padding:'8px 14px',color:C.white,fontSize:12,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:6}}>
                <FileDown size={13}/> Export PDF
              </button>
              <button onClick={()=>setShowEmail(true)}
                style={{background:'rgba(205,49,81,0.8)',border:'1px solid rgba(205,49,81,0.5)',borderRadius:8,padding:'8px 14px',color:C.white,fontSize:12,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:6}}>
                <Mail size={13}/> Email Team
              </button>
              {/* Hidden PM button — subtle lock icon */}
              <button onClick={()=>setShowPM(true)} title="PM Controls"
                style={{background:'rgba(255,255,255,0.07)',border:'1px solid rgba(255,255,255,0.12)',borderRadius:8,padding:'8px 10px',cursor:'pointer',display:'flex',alignItems:'center',gap:5,transition:'all 0.2s'}}
                onMouseEnter={e=>{e.currentTarget.style.background='rgba(255,255,255,0.15)';}}
                onMouseLeave={e=>{e.currentTarget.style.background='rgba(255,255,255,0.07)';}}>
                <Lock size={13} color="rgba(255,255,255,0.45)"/>
              </button>
            </div>
          </div>
          <div style={{display:'flex',gap:20,marginTop:14,fontSize:11,color:'rgba(255,255,255,0.5)'}}>
            <span>Duration: <strong style={{color:'rgba(255,255,255,0.8)'}}>215 days</strong></span>
            <span>Start: <strong style={{color:'rgba(255,255,255,0.8)'}}>Jan 16, 2026</strong></span>
            <span>End: <strong style={{color:'rgba(255,255,255,0.8)'}}>Nov 30, 2026</strong></span>
            <span>Updated: <strong style={{color:C.flamingo300}}>{lastUpdated}</strong></span>
            {changelog.length>0&&<span style={{color:C.palm300}}>· {changelog.length} update{changelog.length>1?'s':''} logged</span>}
          </div>
          <div className="no-print" style={{display:'flex',gap:2,marginTop:16}}>
            {navTabs.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)}
                style={{padding:'10px 18px',border:'none',borderRadius:'8px 8px 0 0',cursor:'pointer',fontFamily:'inherit',fontWeight:700,fontSize:12,display:'flex',alignItems:'center',gap:6,transition:'all 0.15s',background:tab===t.id?C.gray50:'rgba(255,255,255,0.08)',color:tab===t.id?C.violet:'rgba(255,255,255,0.65)'}}>
                {t.icon}{t.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      <div style={{padding:'24px 32px',maxWidth:1280,margin:'0 auto'}}>

        {/* ── DASHBOARD TAB ── */}
        {tab==='dashboard'&&(
          <>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16,marginBottom:20}}>
              {[
                {label:'Overall Progress',val:`${overall}%`,sub:`Baseline: ${baseline}% · ${overall>=baseline?`▲ +${overall-baseline}%`:`▼ ${overall-baseline}%`} vs plan`,icon:<Target size={18}/>,accent:overall>=baseline?C.palm:C.flamingo,bar:overall,baseline},
                {label:'Active Phases',val:phases.filter(p=>p.status==='In Progress').length,sub:`of ${phases.length} total`,icon:<Clock size={18}/>,accent:C.flamingo},
                {label:'Phases Done',val:`${phases.filter(p=>p.status==='Completed').length}/${phases.length}`,sub:'completed',icon:<CheckCircle size={18}/>,accent:C.palm},
                {label:'Pilot Go-Live',val:'Apr 30',sub:'57 days remaining',icon:<Shield size={18}/>,accent:C.violet},
              ].map((k,i)=>(
                <div key={i} style={{...card,padding:'18px 20px',position:'relative',overflow:'hidden'}}>
                  <div style={{position:'absolute',top:0,left:0,right:0,height:3,background:k.accent}}/>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                    <span style={{fontSize:10,fontWeight:700,color:C.gray500,textTransform:'uppercase',letterSpacing:0.8}}>{k.label}</span>
                    <span style={{color:k.accent,opacity:0.7}}>{k.icon}</span>
                  </div>
                  <div style={{fontSize:28,fontWeight:800,color:C.dark}}>{k.val}</div>
                  <div style={{fontSize:11,color:C.gray500,marginTop:2}}>{k.sub}</div>
                  {k.bar!==undefined&&<div style={{marginTop:10,position:'relative',height:7,background:C.violet100,borderRadius:4}}>
                    {k.baseline!==undefined&&k.baseline>0&&<div style={{position:'absolute',top:0,left:0,height:'100%',borderRadius:4,width:`${k.baseline}%`,background:'rgba(205,49,81,0.2)',borderTop:`2px dashed ${C.flamingo300}`}}/>}
                    <div style={{position:'absolute',top:0,left:0,height:'100%',borderRadius:4,background:`linear-gradient(90deg,${k.accent},${C.violet})`,width:`${k.bar}%`,transition:'width 0.6s ease'}}/>
                  </div>}
                </div>
              ))}
            </div>

            <div style={{...card,padding:'20px',marginBottom:20}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
                <h2 style={{...h2s,margin:0}}>Project Phases</h2>
                <div style={{display:'flex',gap:12,fontSize:10,color:C.gray500}}>
                  <span style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:10,height:10,borderRadius:2,background:C.violet,display:'inline-block'}}/> Actual</span>
                  <span style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:10,height:4,borderRadius:2,background:C.flamingo300,display:'inline-block',borderTop:`2px dashed ${C.flamingo}`}}/> Baseline</span>
                  <span style={{color:C.palm700,fontWeight:700}}>▲ Ahead</span>
                  <span style={{color:C.flamingo,fontWeight:700}}>▼ Behind</span>
                </div>
              </div>
              <div style={{fontSize:12}}>
                <div style={{display:'grid',gridTemplateColumns:'2.2fr 0.8fr 0.8fr 0.7fr 1.4fr',gap:8,padding:'8px 10px',borderBottom:`2px solid ${C.violet}`}}>
                  {['Phase','Start','End','Status','Actual vs Baseline'].map(h=><span key={h} style={{fontSize:10,fontWeight:700,color:C.violet700,textTransform:'uppercase',letterSpacing:0.6}}>{h}</span>)}
                </div>
                {phases.map((p,i)=>{
                  const delta = (p.progress||0) - (p.baseline||p.progress||0);
                  return (
                  <React.Fragment key={p.id}>
                    <div onClick={()=>toggle(p.id)} style={{display:'grid',gridTemplateColumns:'2.2fr 0.8fr 0.8fr 0.7fr 1.4fr',gap:8,padding:'12px 10px',borderBottom:`1px solid ${C.violet50}`,background:i%2===0?C.white:C.gray50,cursor:'pointer',alignItems:'center'}}>
                      <div style={{display:'flex',alignItems:'center',gap:6}}>{expanded[p.id]?<ChevronDown size={14} color={C.violet}/>:<ChevronRight size={14} color={C.violet400}/>}<span style={{fontWeight:700,color:C.dark}}>{p.name}</span></div>
                      <span style={{color:C.gray700,fontSize:11}}>{p.start.slice(5)}</span>
                      <span style={{color:C.gray700,fontSize:11}}>{p.end.slice(5)}</span>
                      <span style={{padding:'2px 8px',borderRadius:20,fontSize:10,fontWeight:700,background:STATUS_BG[p.status],color:STATUS_FG[p.status],textAlign:'center',whiteSpace:'nowrap'}}>{p.status}</span>
                      <div style={{display:'flex',alignItems:'center',gap:6}}>
                        <div style={{flex:1,position:'relative',height:8}}>
                          {/* Baseline track */}
                          <div style={{position:'absolute',top:0,left:0,right:0,height:8,background:C.violet50,borderRadius:4}}/>
                          {/* Baseline bar */}
                          {(p.baseline||0)>0&&<div style={{position:'absolute',top:0,left:0,height:8,borderRadius:4,width:`${p.baseline||0}%`,background:'rgba(205,49,81,0.18)',borderTop:`2px dashed ${C.flamingo300}`}}/>}
                          {/* Actual bar */}
                          <div style={{position:'absolute',top:0,left:0,height:8,borderRadius:4,width:`${p.progress}%`,background:p.progress===100?C.palm:`linear-gradient(90deg,${C.violet},${C.violet400})`,transition:'width 0.4s'}}/>
                        </div>
                        <span style={{fontSize:11,fontWeight:800,color:p.progress===100?C.palm700:C.violet,minWidth:28,textAlign:'right'}}>{p.progress}%</span>
                        {delta!==0&&<span style={{fontSize:10,fontWeight:700,color:delta>0?C.palm700:C.flamingo,minWidth:28}}>{delta>0?`▲+${delta}`:`▼${delta}`}%</span>}
                      </div>
                    </div>
                    {expanded[p.id]&&(
                      <div style={{background:C.violet50,borderBottom:`1px solid ${C.violet100}`}}>
                        {p.tasks.map((t,ti)=>{
                          const td = (t.progress||0)-(t.baseline||0);
                          return(
                          <div key={ti} style={{display:'grid',gridTemplateColumns:'2.2fr 0.8fr 0.8fr 0.7fr 1.4fr',gap:8,padding:'8px 10px 8px 36px',borderBottom:`1px solid ${C.violet100}`,alignItems:'center'}}>
                            <span style={{fontSize:11,color:C.gray700}}>{t.name}</span><span/><span/>
                            <span style={{fontSize:10,color:t.progress===100?C.palm700:t.progress>0?C.violet:C.gray500,fontWeight:600}}>{t.progress===100?'✓ Done':t.progress>0?'Active':'Pending'}</span>
                            <div style={{display:'flex',alignItems:'center',gap:5}}>
                              <div style={{flex:1,position:'relative',height:6}}>
                                <div style={{position:'absolute',inset:0,background:C.violet100,borderRadius:3}}/>
                                {(t.baseline||0)>0&&<div style={{position:'absolute',top:0,left:0,height:'100%',borderRadius:3,width:`${t.baseline||0}%`,background:'rgba(205,49,81,0.15)',borderTop:`1.5px dashed ${C.flamingo300}`}}/>}
                                <div style={{position:'absolute',top:0,left:0,height:'100%',borderRadius:3,width:`${t.progress}%`,background:t.progress===100?C.palm:C.violet400}}/>
                              </div>
                              <span style={{fontSize:10,fontWeight:700,color:t.progress===100?C.palm700:C.violet,minWidth:26,textAlign:'right'}}>{t.progress}%</span>
                              {td!==0&&<span style={{fontSize:9,fontWeight:700,color:td>0?C.palm700:C.flamingo,minWidth:22}}>{td>0?`+${td}`:`${td}`}</span>}
                            </div>
                          </div>
                        )})}
                      </div>
                    )}
                  </React.Fragment>
                )})}
              </div>
            </div>



            <div style={{...card,padding:'20px',marginBottom:20}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
                <h2 style={{...h2s,margin:0,display:'flex',alignItems:'center',gap:8}}><Clock size={15} color={C.flamingo}/> Pilot Phase — Key Milestones</h2>
                <span style={{fontSize:11,color:C.gray500}}>Target: Apr 30, 2026</span>
              </div>
              {/* Timeline connector */}
              <div style={{position:'relative',display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:12}}>
                <div style={{position:'absolute',top:18,left:'10%',right:'10%',height:2,background:`linear-gradient(90deg,${C.violet100},${C.violet200})`,zIndex:0}}/>
                {DEFAULT_MILESTONES.map((m,i)=>{
                  const riskColor = m.risk==='critical'?C.flamingo:m.risk==='high'?C.amber:m.risk==='medium'?C.violet:C.palm;
                  const riskBg = m.risk==='critical'?C.flamingo50:m.risk==='high'?C.amber50:m.risk==='medium'?C.violet50:C.palm50;
                  return (
                    <div key={i} style={{display:'flex',flexDirection:'column',alignItems:'center',position:'relative',zIndex:1}}>
                      {/* Node */}
                      <div style={{width:38,height:38,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',background:m.done?C.violet:C.white,border:`3px solid ${m.done?C.violet:riskColor}`,marginBottom:10,fontSize:16,boxShadow:`0 0 0 4px ${riskBg}`,transition:'all 0.2s'}}>
                        {m.done ? <CheckCircle size={16} color={C.white}/> : <span>{m.icon}</span>}
                      </div>
                      {/* Card */}
                      <div style={{background:C.white,border:`1px solid ${m.done?C.violet100:riskColor+'40'}`,borderRadius:10,padding:'10px 10px',width:'100%',borderTop:`3px solid ${m.done?C.palm:riskColor}`}}>
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}}>
                          <span style={{fontSize:10,fontWeight:800,color:m.done?C.palm700:C.dark,lineHeight:1.3}}>{m.name}</span>
                        </div>
                        <div style={{fontSize:10,color:C.gray500,marginBottom:6,fontWeight:600}}>{m.dateShort}</div>
                        <p style={{fontSize:10,color:C.gray700,margin:'0 0 8px',lineHeight:1.5}}>{m.desc}</p>
                        {/* Progress bar */}
                        <div style={{height:4,background:C.gray100,borderRadius:2,marginBottom:6,overflow:'hidden'}}>
                          <div style={{height:'100%',width:`${m.pct}%`,background:m.done?C.palm:m.pct>60?C.violet:m.pct>30?C.amber:riskColor,borderRadius:2,transition:'width 0.4s'}}/>
                        </div>
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                          <span style={{fontSize:9,color:C.gray500}}>{m.owner}</span>
                          <div style={{display:'flex',alignItems:'center',gap:4}}>
                            <span style={{padding:'1px 6px',borderRadius:8,fontSize:9,fontWeight:700,background:riskBg,color:riskColor,textTransform:'capitalize'}}>{m.risk}</span>
                            <span style={{fontSize:10,fontWeight:800,color:m.done?C.palm700:m.pct>0?C.violet:C.gray400}}>{m.done?'✓':m.pct+'%'}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

          </>
        )}

        {tab==='actions'&&<ActionTrackerTab actions={actions}/>}
        {tab==='advisor'&&<CTOAdvisor phases={phases} actions={actions} onEmailOpen={()=>setShowEmail(true)}/>}

        <div style={{textAlign:'center',padding:'16px 0 8px'}}>
          <div style={{height:2,background:`linear-gradient(90deg,transparent,${C.flamingo300},${C.violet400},${C.palm300},transparent)`,marginBottom:12}}/>
          <p style={{color:C.gray500,fontSize:10,fontWeight:500,letterSpacing:0.5}}>Smart Check-In Project Dashboard &nbsp;•&nbsp; DCT Abu Dhabi &nbsp;•&nbsp; Last updated: {lastUpdated}</p>
        </div>
      </div>

      <style>{`
        .spin{animation:spin 1s linear infinite;}
        @media print {
          body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
          @page { margin: 12mm 10mm; size: A4 landscape; }
          .no-print { display: none !important; }
          button, .no-print { display: none !important; }
          * { box-shadow: none !important; }
        }
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
      `}</style>
    </div>
  );
}


function App() { return <Dashboard />; }
const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(<App />);
</script>
</body>
</html>
